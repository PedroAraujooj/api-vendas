spring.application.name=auth-service
server.port=8084
# Registro automatico para descoberta pelo Gateway.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
auth.issuer=${AUTH_ISSUER:http://auth-service}
auth.audience=clientes-service
auth.access-token-seconds=${ACCESS_TOKEN_SECONDS:300}
auth.refresh-token-seconds=${REFRESH_TOKEN_SECONDS:86400}
# Credenciais exclusivamente para a demonstracao local.
auth.username=${DEMO_USERNAME:aluno}
auth.password=${DEMO_PASSWORD:Prova123!}
