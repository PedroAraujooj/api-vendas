name: Build fornecedores-service

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5
      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: fornecedores-service/pom.xml
      - name: Compilar fornecedores-service
        run: mvn -B -f fornecedores-service/pom.xml clean package
