name: Build fornecedores-service

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: fornecedores-service/pom.xml
      - name: Compilar e testar fornecedores-service
        run: mvn --batch-mode --no-transfer-progress -f fornecedores-service/pom.xml clean verify
